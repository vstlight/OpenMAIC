name: Build and push image

# 每次 push 到 main 时构建 Docker 镜像并推送到 GHCR：
#   ghcr.io/vstlight/openmaic:latest
#   ghcr.io/vstlight/openmaic:main-<sha>
# 服务器端 watchtower 检测到 latest digest 变化后自动重建容器。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      next_public_enable_video_export:
        description: 'NEXT_PUBLIC_ENABLE_VIDEO_EXPORT (build-time flag, needs render-service)'
        required: false
        default: ''
      next_public_persistence:
        description: 'NEXT_PUBLIC_PERSISTENCE (build-time flag, needs PostgreSQL)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vstlight/openmaic
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_ENABLE_VIDEO_EXPORT=${{ inputs.next_public_enable_video_export }}
            NEXT_PUBLIC_PERSISTENCE=${{ inputs.next_public_persistence }}
